name: Electron Launcher (Windows)

on:
  push:
    paths:
      - 'launcher-electron/**'
      - 'launcher.cmd'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:

jobs:
  launcher:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: launcher-electron/package-lock.json
      - name: Install dependencies
        working-directory: launcher-electron
        run: npm ci --no-audit --no-fund
      - name: Verify presets, cache and command integration
        working-directory: launcher-electron
        run: npm test
      - name: Package desktop launcher
        working-directory: launcher-electron
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: DemonsSoulsLauncher-win32-x64
          path: _Build/demons-souls-launcher-v3/DemonsSoulsLauncher-win32-x64
